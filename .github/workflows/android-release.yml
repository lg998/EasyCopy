name: Android Release

on:
  push:
    branches:
      - "master"
      - "feat/reader-clock-default-on"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: false
        type: string
      prerelease:
        description: "Mark this GitHub Release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-android-release:
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: "3.41.4"
      JAVA_VERSION: "17"
      PUB_HOSTED_URL: "https://pub.dev"
      PUB_CACHE: ${{ github.workspace }}/.pub-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          version_line="$(tr -d '\r' < pubspec.yaml | sed -nE 's/^version:[[:space:]]+(.+)$/\1/p' | head -n1)"
          if [[ -z "$version_line" ]]; then
            echo "Could not read version from pubspec.yaml." >&2
            exit 1
          fi

          app_version="${version_line%%+*}"
          build_number="${version_line##*+}"
          expected_tag="v${app_version}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" ]]; then
            release_tag="${{ github.event.inputs.tag }}"
            prerelease_flag="${{ github.event.inputs.prerelease }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            release_tag="${{ github.ref_name }}"
            prerelease_flag="false"
          else
            release_tag="$expected_tag"
            prerelease_flag="false"
          fi

          notes_path=".github/release-notes/${release_tag}.md"

          if [[ -f "$notes_path" ]]; then
            echo "has_custom_notes=true" >> "$GITHUB_OUTPUT"
            echo "release_notes_path=$notes_path" >> "$GITHUB_OUTPUT"
          else
            echo "has_custom_notes=false" >> "$GITHUB_OUTPUT"
            echo "release_notes_path=" >> "$GITHUB_OUTPUT"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_title=EasyCopy $app_version" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease_flag" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Prepare signing configuration
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" && -n "${ANDROID_STORE_PASSWORD:-}" && -n "${ANDROID_KEY_ALIAS:-}" && -n "${ANDROID_KEY_PASSWORD:-}" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed APKs (arm64-v8a)
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.has_keystore == 'true' && format('{0}/android/upload-keystore.jks', github.workspace) || '' }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EASY_COPY_ALLOW_DEBUG_SIGNING: "true"
        run: |
          set -euo pipefail
          flutter build apk \
            --release \
            --target-platform=android-arm64 \
            --split-per-abi \
            --tree-shake-icons

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          version="${{ steps.meta.outputs.app_version }}"
          source="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"

          if [[ ! -f "$source" ]]; then
            echo "APK not found: $source" >&2
            exit 1
          fi

          cp "$source" "dist/EasyCopy-${version}-android-arm64-v8a.apk"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EasyCopy-${{ steps.meta.outputs.release_tag }}-android-arm64-v8a
          path: dist/*.apk
          if-no-files-found: error

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_title }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: |
            dist/*.apk
          fail_on_unmatched_files: true


